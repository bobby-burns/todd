name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Before you paste logs or screenshots, remove API keys, tokens, cookies, card details and personal data.**
        Security problems go through [private vulnerability reporting](https://github.com/bobby-burns/todd/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The goal you gave the run, the settings involved, and what you clicked.
      placeholder: |
        1. Start a run with the goal "…"
        2. The planner spawns …
        3. …
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Your Claude plan (Claude Code)
        - API keys (LiteLLM)
        - Not engine-specific
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model(s)
      placeholder: e.g. claude-opus-5-5, gpt-5, ollama_chat/qwen3:14b
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Planner / agents
        - Browser / accounts
        - Sandbox
        - Spend policy / approvals
        - Integrations / MCP / plugins
        - Dashboard
        - Docker / setup
        - Other
  - type: input
    id: version
    attributes:
      label: Todd version or commit
      placeholder: e.g. v0.4.0 or the output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. macOS 26 (Apple silicon), Docker 28.3, Compose 2.39
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `docker compose logs api` (or `web`, `browser`, `sandbox`). Scrub secrets first.
      render: shell
